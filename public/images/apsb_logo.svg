<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="4" y1="20" x2="60" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#22d3ee" />
      <stop offset="50%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#818cf8" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="20" y1="18" x2="48" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#cffafe" stopOpacity="0.85" />
      <stop offset="100%" stopColor="#0891b2" stopOpacity="0.4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="24" y1="6" x2="42" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="6" y1="34" x2="58" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#93c5fd" stopOpacity="0.7" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.9" />
    </linearGradient>
    <radialGradient id="headlightGlow" cx="6" cy="34" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#38bdf8" stopOpacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#090d24" stroke="#06b6d4" stroke-width="1.5" />
  <ellipse cx="6" cy="35" rx="5" ry="4" fill="url(#headlightGlow)" />

  <!-- Ambassador Car Body -->
  <path
    d="M 5 37 C 4 34, 5 31, 8 29 C 11 27, 16 26.5, 20 26.5 L 24 19 C 25.5 16, 28 15, 33 15 L 42 15 C 46 15, 48.5 16.5, 50 19 L 54 26 C 57 27, 59.5 29.5, 60 33 C 60.5 36, 59 38, 56 39 L 52 39 C 51.5 35, 47.5 32, 43 32 C 38.5 32, 34.5 35, 34 39 L 25 39 C 24.5 35, 20.5 32, 16 32 C 11.5 32, 7.5 35, 7 39 L 5 39 Z"
    fill="url(#bodyGrad)"
    stroke="#67e8f9"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Ambassador Split Windows -->
  <path d="M 25.5 20 L 32 20 L 32 26 L 22.5 26 Z" fill="url(#glassGrad)" stroke="#a5f3fc" stroke-width="0.8" />
  <path d="M 33.5 20 L 41.5 20 C 44 20, 46 21, 47.5 23 L 49.5 26 L 33.5 26 Z" fill="url(#glassGrad)" stroke="#a5f3fc" stroke-width="0.8" />

  <!-- Side Chrome Trim Line -->
  <path d="M 7 31 C 18 30.5, 38 30.5, 57 32" stroke="url(#chromeGrad)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Classic Headlamp -->
  <circle cx="6.5" cy="33.5" r="2.2" fill="#ffffff" stroke="#38bdf8" stroke-width="0.8" />
  <circle cx="6.5" cy="33.5" r="1.1" fill="#38bdf8" />

  <!-- Wheels -->
  <circle cx="16" cy="39" r="5.5" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="16" cy="39" r="3.2" fill="url(#bodyGrad)" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="16" cy="39" r="1.2" fill="#ffffff" />

  <circle cx="43" cy="39" r="5.5" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="43" cy="39" r="3.2" fill="url(#bodyGrad)" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="43" cy="39" r="1.2" fill="#ffffff" />

  <!-- Education Mortarboard Cap Accent -->
  <path d="M 33 6 L 41 10 L 33 14 L 25 10 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1" stroke-linejoin="round" />
  <path d="M 28 11.5 L 28 14 C 28 15.5, 38 15.5, 38 14 L 38 11.5" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="0.8" />
  <path d="M 33 10 Q 39 10 40 13 L 40.5 15" stroke="#fef08a" stroke-width="0.8" stroke-linecap="round" />
  <circle cx="40.5" cy="15.5" r="0.8" fill="#fef08a" />
</svg>
